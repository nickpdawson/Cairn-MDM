name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  cross-compile:
    # There are no FreeBSD CI runners; a build-only smoke test keeps every
    # release target honest on every change.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: freebsd, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -o /dev/null ./cmd/cairn

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        # Advisory: reports issues without failing the build (the remaining
        # findings are CLI-path / static-query false positives; the material
        # HTTP-timeout + file-mode ones are fixed).
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./... || true

# TODO(supply-chain): pin these actions to immutable commit SHAs (e.g. via
# `ratchet`) instead of version tags before the first public release.
