<!doctype html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <span class="wordmark">▲ <span class="peak">Cairn</span></span>
      <div class="tagline">Device management, quietly.</div>
      {{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autofocus value="{{.Username}}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button class="btn" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
